# Backend only: PostgreSQL + Django API. The frontend is deployed separately (Vercel).
#
#   Server:  cp .env.example .env   # fill in the production values
#            docker compose up -d --build
#   Local:   docker compose up -d db   # just the database, for ./scripts/start.sh dev
#
# Every setting lives in .env (same names Django reads). Use another file with ENV_FILE=path.
# Serve the API over HTTPS (e.g. https://api.your-domain): the Vercel site is HTTPS and
# browsers block plain-HTTP images and form posts from it.

name: merci-portfolio

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Localhost only, never public. Lets a locally run Django use it.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # Pull the image CI publishes (set API_IMAGE in .env, e.g. youruser/merci-portfolio-api:latest),
    # or build it here from source when API_IMAGE is unset.
    image: ${API_IMAGE:-merci-portfolio-api:local}
    build: .
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      # Fixed for the container, whatever .env says for local development.
      DATABASE_URL: postgres://portfolio:${POSTGRES_PASSWORD:-portfolio}@db:5432/portfolio
      DJANGO_SETTINGS_MODULE: config.settings.production
      # Your API domain(s) from .env, plus the name the health check uses.
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost},localhost,127.0.0.1
    volumes:
      - media:/app/media
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  pgdata:
  media:
