# Keeps dependencies current with small, grouped pull requests every Monday.
# Each pull request runs the CI workflow like any other change.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # Packages that must move together are grouped so their pins never conflict.
    groups:
      django:
        patterns: ["Django", "djangorestframework", "django-cors-headers", "django-stubs*", "djangorestframework-stubs"]
      lint:
        patterns: ["black", "isort", "flake8*", "mypy", "pre-commit"]
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Stay on the Django 5.2 LTS line; major upgrades are done by hand.
      - dependency-name: "Django"
        update-types: ["version-update:semver-major"]
      - dependency-name: "django-stubs*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
