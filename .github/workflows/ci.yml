# CI: quality gates for every pull request.
#
#   lint (pre-commit: black, isort, flake8, mypy + hygiene) → tests on PostgreSQL 16 → Docker build check
#
# Nothing is published here and no credentials are used. Publishing the image happens in
# release.yml when a pull request is merged to main.

name: CI

on:
  # Every pull request, including stacked PRs that target another feature branch.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per pull request; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (pre-commit · black · isort · flake8 · mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pre-commit
        run: pip install "pre-commit==4.0.1"

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run all hooks
        run: pre-commit run --all-files --show-diff-on-failure --color always

  test:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: portfolio
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://portfolio:portfolio@localhost:5432/portfolio
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Django system checks
        run: python manage.py check --fail-level WARNING

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test apps --verbosity 2

      - name: Production settings refuse a placeholder secret
        run: |
          if DJANGO_SETTINGS_MODULE=config.settings.production DJANGO_SECRET_KEY=change-me \
             python manage.py check 2>/dev/null; then
            echo "::error::Production settings accepted a placeholder secret key"; exit 1
          fi

  docker:
    name: Docker image (build check)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the production image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: merci-portfolio-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
