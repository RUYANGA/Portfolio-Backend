# Release: build the production image and push it to Docker Hub.
#
# Runs when a pull request is merged to main (tags: latest, sha-<commit>) and when a version tag
# is pushed (v1.2.3 → tags 1.2.3 and 1.2). Quality gates already ran on the pull request in ci.yml.
#
# Repository settings (Settings → Secrets and variables → Actions):
#   Secrets:   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (Docker Hub access token, Read & Write)
#   Variable:  DOCKERHUB_REPOSITORY (optional, default: <DOCKERHUB_USERNAME>/merci-portfolio-api)

name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

# Releases run one at a time, in order; none is cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Check Docker Hub credentials
        env:
          HAS_USERNAME: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          HAS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
          USERNAME_IN_VARS: ${{ vars.DOCKERHUB_USERNAME != '' }}
          TOKEN_IN_VARS: ${{ vars.DOCKERHUB_TOKEN != '' }}
        run: |
          missing=""
          [ "$HAS_USERNAME" = true ] || missing="$missing DOCKERHUB_USERNAME"
          [ "$HAS_TOKEN" = true ] || missing="$missing DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error title=Docker Hub credentials missing::Add these repository secrets (Settings → Secrets and variables → Actions → Secrets):$missing"
            if [ "$USERNAME_IN_VARS" = true ] || [ "$TOKEN_IN_VARS" = true ]; then
              echo "::error title=Saved as variables::Docker Hub credentials are saved as Variables. Move them to Secrets and delete the variables: variables are plain text."
            fi
            exit 1
          fi

      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: echo "name=${REPOSITORY:-$USERNAME/merci-portfolio-api}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=merci-portfolio-api
            org.opencontainers.image.description=Django API for the Merci Ruyanga portfolio

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Pushed to Docker Hub"
            echo '```'
            echo "$TAGS"
            echo '```'
            echo "Deploy on the server: \`docker compose pull api && docker compose up -d --no-build\`"
          } >> "$GITHUB_STEP_SUMMARY"
