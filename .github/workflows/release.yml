# Release: build the production image, push it to Docker Hub, and deploy it on Coolify.
#
# Runs when a pull request is merged to main (tags: latest, sha-<commit>) and when a version tag
# is pushed (v1.2.3 → tags 1.2.3 and 1.2). Quality gates already ran on the pull request in ci.yml.
# Merges to main are then deployed: Coolify's deploy webhook is called, and the job waits until
# the API's /api/health/ reports the new commit.
#
# Repository settings (Settings → Secrets and variables → Actions):
#   Secrets:   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (Docker Hub access token, Read & Write)
#              COOLIFY_WEBHOOK  (Coolify → the API resource → Webhooks → "Deploy Webhook" URL)
#              COOLIFY_TOKEN    (Coolify → Keys & Tokens → API tokens, with the "deploy" permission)
#   Variables: DOCKERHUB_REPOSITORY (optional, default: <DOCKERHUB_USERNAME>/merci-portfolio-api)
#              API_HEALTH_URL (optional, default: https://api.ruyanga.com/api/health/)
# Without the Coolify secrets the deploy job only warns, and you redeploy in Coolify by hand.

name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

# Releases run one at a time, in order; none is cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Check Docker Hub credentials
        env:
          HAS_USERNAME: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          HAS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
          USERNAME_IN_VARS: ${{ vars.DOCKERHUB_USERNAME != '' }}
          TOKEN_IN_VARS: ${{ vars.DOCKERHUB_TOKEN != '' }}
        run: |
          missing=""
          [ "$HAS_USERNAME" = true ] || missing="$missing DOCKERHUB_USERNAME"
          [ "$HAS_TOKEN" = true ] || missing="$missing DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error title=Docker Hub credentials missing::Add these repository secrets (Settings → Secrets and variables → Actions → Secrets):$missing"
            if [ "$USERNAME_IN_VARS" = true ] || [ "$TOKEN_IN_VARS" = true ]; then
              echo "::error title=Saved as variables::Docker Hub credentials are saved as Variables. Move them to Secrets and delete the variables: variables are plain text."
            fi
            exit 1
          fi

      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: echo "name=${REPOSITORY:-$USERNAME/merci-portfolio-api}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=merci-portfolio-api
            org.opencontainers.image.description=Django API for the Merci Ruyanga portfolio

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Pushed to Docker Hub"
            echo '```'
            echo "$TAGS"
            echo '```'
            echo "Merges to main are deployed by the next job (Coolify deploy webhook)."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy on Coolify
    runs-on: ubuntu-latest
    needs: publish
    # Version tags only publish an image; merges to main go live.
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    environment: production
    steps:
      - name: Trigger the Coolify deployment
        id: trigger
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK" ] || [ -z "$TOKEN" ]; then
            echo "::warning title=Automatic deploy is off::Add the COOLIFY_WEBHOOK and COOLIFY_TOKEN secrets to deploy on every merge. Until then, press Redeploy in Coolify."
            echo "triggered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Coolify pulls the image tagged latest (pushed above) and restarts the container.
          # Coolify 4.3+ only accepts POST on the deploy endpoint.
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 --request POST \
            --header "Authorization: Bearer $TOKEN" "$WEBHOOK"
          echo
          echo "triggered=true" >> "$GITHUB_OUTPUT"

      - name: Wait until the new version is live
        if: steps.trigger.outputs.triggered == 'true'
        env:
          HEALTH_URL: ${{ vars.API_HEALTH_URL || 'https://api.ruyanga.com/api/health/' }}
          SHA: ${{ github.sha }}
        run: |
          want="${SHA:0:12}"
          # Up to 15 minutes: pull, migrations and start-up.
          for attempt in $(seq 1 90); do
            live=$(curl --silent --max-time 10 "$HEALTH_URL" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin).get("version", ""))' 2>/dev/null || true)
            if [ "$live" = "$want" ]; then
              echo "Deployed: $HEALTH_URL reports $live"
              echo "### Deployed \`$want\` on Coolify" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Waiting for $want (live: ${live:-not answering})"
            sleep 10
          done
          echo "::error title=Deploy not live::$HEALTH_URL still doesn't report $want after 15 minutes. Check the deployment logs in Coolify."
          exit 1
